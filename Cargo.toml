[package]
name = "amex-together"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Reconcile shared and personal Amex spending on your own computer"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
directories = "6"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = "=0.36.2"
pdf-extract = "0.10"
regex = "1"
rfd = "0.15"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
strip = "none"
